name: Fork release

# Manual release of the ivolnistov/paseo fork from one explicit tag, commit and package version. Only the
# protected jobs hold credentials: release-apk (signing), publish-packages (GitHub Packages) and publish-release
# (draft GitHub release). Never runs the root `release:publish` script.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, already pushed (for example v0.13.0-fork.1)
        required: true
        type: string
      sha:
        description: Full commit SHA the tag must point at
        required: true
        type: string
      version:
        description: Exact version for the seven owned npm packages (for example 0.13.0-fork.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'ivolnistov/paseo'
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.check.outputs.app_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: check
        name: Tag, commit and version agree, and the commit is on main
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full commit SHA"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "version must be exact"; exit 1; }
          [[ "$TAG" =~ ^[0-9A-Za-z._/-]+$ ]] || { echo "unexpected tag characters"; exit 1; }
          tagged=$(git rev-parse --verify "refs/tags/${TAG}^{commit}")
          [ "$tagged" = "$SHA" ] || { echo "tag $TAG is $tagged, not $SHA"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main || { echo "$SHA is not on main"; exit 1; }
          app_version=$(git show "${SHA}:packages/app/package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "source app version $app_version; fork package version $VERSION"

  pack:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build:server
      - name: Pack the seven owned packages
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/fork-release.mjs prepare --src . --version "$VERSION" --out "$RUNNER_TEMP/packages"
          node scripts/fork-release.mjs plan-publish --manifest "$RUNNER_TEMP/packages/manifest.json" \
            --registry https://npm.pkg.github.com
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fork-packages
          path: ${{ runner.temp }}/packages
          if-no-files-found: error

  release-apk:
    needs: validate
    runs-on: ubuntu-latest
    environment: fork-release-apk
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Write signing and Firebase inputs (mode 0600, runner temp only)
        env:
          KEYSTORE_B64: ${{ secrets.FORK_RELEASE_KEYSTORE_B64 }}
          STOREPASS: ${{ secrets.FORK_RELEASE_STOREPASS }}
          GOOGLE_SERVICES: ${{ secrets.FORK_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/release.p12"
          printf '%s' "$STOREPASS" > "$RUNNER_TEMP/signing/storepass"
          printf '%s' "$GOOGLE_SERVICES" > "$RUNNER_TEMP/signing/google-services.json"
      - run: npm ci
      - run: npm run build:app-deps
      - name: Build, sign and verify with the reviewed helper
        env:
          SHA: ${{ inputs.sha }}
          APP_VERSION: ${{ needs.validate.outputs.app_version }}
        run: |
          bash scripts/build-apk.sh --src . --expected-sha "$SHA" --version "$APP_VERSION" \
            --variant production --abi arm64-v8a \
            --google-services "$RUNNER_TEMP/signing/google-services.json" \
            --keystore "$RUNNER_TEMP/signing" \
            --expected-cert 0226bc7d8f756b50c0bfddd40a3e942086b38a7354fd2ba5fdda713c7aca5ec0 \
            --java-home "$JAVA_HOME" --android-home "$ANDROID_HOME" \
            --state-dir "$RUNNER_TEMP/apk-state" --out "$RUNNER_TEMP/apk" --with-jvm-tests
      - name: Remove signing inputs
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fork-apk
          path: |
            ${{ runner.temp }}/apk/*.apk
            ${{ runner.temp }}/apk/*.apk.sha256
            ${{ runner.temp }}/apk/*.apk.build-manifest.json
          if-no-files-found: error

  publish-packages:
    needs: [validate, pack]
    runs-on: ubuntu-latest
    environment: fork-release-packages
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: fork-packages
          path: ${{ runner.temp }}/packages
      - name: Validate the exact artifacts against the strict registry
        run: |
          node scripts/fork-release.mjs plan-publish --manifest "$RUNNER_TEMP/packages/manifest.json" \
            --registry https://npm.pkg.github.com
      - name: Publish the seven owned packages, components first and the CLI last
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "@ivolnistov:registry=https://npm.pkg.github.com" \
            '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$RUNNER_TEMP/npmrc"
          node -e '
            const m = require(process.argv[1]);
            if (m.source.sha !== process.argv[2]) { console.error("manifest source differs from input sha"); process.exit(1); }
            const order = ["@ivolnistov/paseo-protocol", "@ivolnistov/paseo-highlight", "@ivolnistov/paseo-relay",
              "@ivolnistov/paseo-client", "@ivolnistov/paseo-plugin", "@ivolnistov/paseo-server", "@ivolnistov/paseo"];
            for (const name of order) console.log(m.packages.find((p) => p.name === name).tarball);
          ' "$RUNNER_TEMP/packages/manifest.json" "$SHA" | while read -r tarball; do
            npm publish "$RUNNER_TEMP/packages/$tarball" --userconfig "$RUNNER_TEMP/npmrc" \
              --registry https://npm.pkg.github.com --ignore-scripts
          done
          rm -f "$RUNNER_TEMP/npmrc"

  publish-release:
    needs: [validate, release-apk, publish-packages]
    runs-on: ubuntu-latest
    environment: fork-release-github
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fork-apk
          path: ${{ runner.temp }}/apk
      - name: Check the APK against its checksum and manifest
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/apk"
          sha256sum -c ./*.apk.sha256
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const file = fs.readdirSync(".").find((f) => f.endsWith(".apk.build-manifest.json"));
            const m = JSON.parse(fs.readFileSync(file, "utf8"));
            const apk = fs.readFileSync(m.artifact.file);
            if (crypto.createHash("sha256").update(apk).digest("hex") !== m.artifact.sha256) process.exit(1);
            if (m.source.sha !== process.argv[1]) { console.error("APK manifest source differs from input sha"); process.exit(1); }
          ' "$SHA"
      - name: Create a draft release (never overwrites an existing one)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then echo "release $TAG already exists"; exit 1; fi
          # A draft: the release text is approved by the owner before publication.
          gh release create "$TAG" --draft --verify-tag --title "$TAG" \
            --notes "Fork build of ${SHA} (packages ${VERSION}). Draft; notes pending owner approval." \
            "$RUNNER_TEMP"/apk/*
